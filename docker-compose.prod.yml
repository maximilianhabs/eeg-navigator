services:
  eeg-navigator:
    build: .
    container_name: eeg-navigator
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - APP_SECRET=${APP_SECRET}
    volumes:
      - eeg_data:/app/data
    networks:
      - nz-dienstplan_app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/impressum"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  eeg_data:
    driver: local

networks:
  nz-dienstplan_app:
    external: true
